<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор QR-коду</title>
<!-- Подключение PWA манифеста -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="32x32" type="image/x-icon">         
<meta name="theme-color" content="#4CAF50">
<!-- Регистрация Service Worker -->
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js')
    .then(() => console.log('Service Worker зарегистрирован'));
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/qr-code-styling/lib/qr-code-styling.js"></script>
<style>


body {
  margin: 0;
  background: #000;
  color: #00ff99;
  font-family: monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
} 

.box {
  background: #111;
  border: 2px solid #00ff99;
  border-radius: 15px;
  padding: 25px;
  max-width: 350px;
  width: 90%;
  box-sizing: border-box;
  text-align: center;
}

input, button {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border-radius: 8px;
  border: 2px solid #00ff99;
  background: #000;
  color: #00ff99;
  margin-top: 15px;
  box-sizing: border-box;
}

button {
  cursor: pointer;
  transition: 0.2s;
}
   button:hover {
  background: #00ff99;
  color: #000;
}
 #qrcode { 
   display: flex;
   margin: 20px auto;
   justify-content: center;
 }

 </style>

</head>

<body>

<div class="box">
   <h2>Генератор QR-коду</h2>
   <p>Введіть номер карти або IBAN:</p>
   <input type="text" id="cardInput" placeholder="Наприклад 4441114407876992">

   <p>Выберите номер страницы продавца:</p>
   <input type="number" id="sellerPage" placeholder="Например 1" min="1" max="1000">

   <button onclick="generateQR()">Створити QR</button>
   </div>
   <div id="hiddenQR" style="display:none;"></div>
<script>
function generateQR() {
    const cardNumber = document.getElementById("cardInput").value.trim();
    const sellerPage = document.getElementById("sellerPage").value.trim();

    if (!cardNumber) {
        alert("Введіть номер карти!");
        return;
    }
    if (!sellerPage || isNaN(sellerPage) || sellerPage < 1 || sellerPage > 1000) {
        alert("Введите корректный номер страницы продавца (1-1000)!");
        return;
    }
   const url = `https://andreyodr33-eng.github.io/developer/?data=${cardNumber}&seller=${sellerPage}`;
   
   const hiddenDiv = document.getElementById("hiddenQR");
   hiddenDiv.innerHTML = "";

    const size = Math.min(window.innerWidth * 0.9, 400);

    

    const qrCode = new QRCodeStyling({
        width: size,
        height: size,
        type: "svg",
        data: url,
        image: "icon-192.png",
        dotsOptions: {
            type: "dots",
            color: "#000000"
            
        },
        cornersSquareOptions: {
            type: "extra-rounded",
            color: "#000000"
        },
        cornersDotOptions: {
            type: "dot",
            color: "#000000"
        },
        backgroundOptions: {
            color: "#ffffff"
        },
        imageOptions: {
            margin: 10,
            imageSize: 0.22,
            hideBackgroundDots: true
        },
        qrOptions: {
            errorCorrectionLevel: "Q"
        }
    });

    qrCode.append(hiddenDiv);

    // открываем вкладку
    const newWindow = window.open("", "_blank");

    newWindow.document.write(`
        <html>
        <head>
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <style>
                body {
                    margin:0;
                    display:flex;
                    justify-content:center;
                    align-items:center;
                    height:100vh;
                    background:white;
                }
            </style>
        </head>
        <body>
            <div id="qrcode"></div>
        </body>
        </html>
    `);

    newWindow.document.close();


    // 🔴 Ждём пока QR реально создастся
    setTimeout(() => {

        const svg = hiddenDiv.querySelector("svg");

        if (svg) {
            const clone = svg.cloneNode(true);
            newWindow.document.getElementById("qrcode").appendChild(clone);
        } else {
            newWindow.document.body.innerHTML = "QR не создан";
        }

    }, 400); // задержка 400мс
}
      
// Клонируем готовый SVG и вставляем в новую вкладку
</script>
<script>

let startX = 0;
let startY = 0;

document.addEventListener(
'touchstart',
function(e){

const t = e.touches[0];

startX = t.clientX;
startY = t.clientY;

},
{passive:true}
);


document.addEventListener(
'touchend',
function(e){

const t = e.changedTouches[0];

let dx = t.clientX - startX;
let dy = t.clientY - startY;


/* игнорируем вертикальный скролл */
if(Math.abs(dy) > Math.abs(dx)){
return;
}


/* свайп влево */
if(dx < -70){

if(
location.pathname.includes("index.html")
||
location.pathname=="/"
){
location.href="tables.html";
}

}


/* свайп вправо */
if(dx > 70){

if(
location.pathname.includes("tables.html")
){
location.href="index.html";
}

}

},
{passive:true}
);

</script>
</body>
</html>
