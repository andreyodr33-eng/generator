<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор QR-коду</title>
<!-- Подключение PWA манифеста -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="32x32" type="image/x-icon">         
<meta name="theme-color" content="#111111">
<script src="./qr-code-styling.js"></script>
<style>


body {
  margin: 0;
  background: #000;
  color: #00ff99;
  font-family: monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  touch-action: pan-y;
} 

.box {
  background: #111;
  border: 2px solid #00ff99;
  border-radius: 15px;
  padding: 25px;
  max-width: 350px;
  width: 90%;
  box-sizing: border-box;
  text-align: center;
}

input, button {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border-radius: 8px;
  border: 2px solid #00ff99;
  background: #000;
  color: #00ff99;
  margin-top: 15px;
  box-sizing: border-box;
}

button {
  cursor: pointer;
  transition: 0.2s;
}
   button:hover {
  background: #00ff99;
  color: #000;
}
 #qrcode { 
   display: flex;
   margin: 20px auto;
   justify-content: center;
 }

 </style>

</head>

<body>

<div class="box">
   <h2>Генератор QR-коду</h2>
   <p>Введіть номер карти або IBAN:</p>
   <input type="text" id="cardInput" placeholder="Наприклад 4441114407876992">

   <p>Выберите номер страницы продавца:</p>
   <input type="number" id="sellerPage" placeholder="Например 1" min="1" max="1000">

   <button onclick="generateQR()">Створити QR</button>
   </div>
   <div id="hiddenQR" style="display:none;"></div>
<script>
function generateQR() {
    const cardNumber = document.getElementById("cardInput").value.trim();
    const sellerPage = document.getElementById("sellerPage").value.trim();

    if (!cardNumber) {
        alert("Введіть номер карти!");
        return;
    }
    if (!sellerPage || isNaN(sellerPage) || sellerPage < 1 || sellerPage > 1000) {
        alert("Введите корректный номер страницы продавца (1-1000)!");
        return;
    }
   const url = `https://andreyodr33-eng.github.io/developer/?data=${cardNumber}&seller=${sellerPage}`;
   
   const hiddenDiv = document.getElementById("hiddenQR");
   hiddenDiv.innerHTML = "";

    const size = Math.min(window.innerWidth * 0.9, 400);

    

    const qrCode = new QRCodeStyling({
        width: size,
        height: size,
        type: "svg",
        data: url,
        image: "icon-192.png",
        dotsOptions: {
            type: "dots",
            color: "#000000"
            
        },
        cornersSquareOptions: {
            type: "extra-rounded",
            color: "#000000"
        },
        cornersDotOptions: {
            type: "dot",
            color: "#000000"
        },
        backgroundOptions: {
            color: "#ffffff"
        },
        imageOptions: {
            margin: 10,
            imageSize: 0.22,
            hideBackgroundDots: true
        },
        qrOptions: {
            errorCorrectionLevel: "Q"
        }
    });

    qrCode.append(hiddenDiv);

    // открываем вкладку
    const newWindow = window.open("", "_blank");
    
    newWindow.document.write(`
        <html>
        <head>
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <style>
                body {
                    margin:0;
                    display:flex;
                    justify-content:center;
                    align-items:center;
                    height:100vh;
                    background:white;
                }
            </style>
        </head>
        <body>
            <div id="qrcode"></div>
            <a href="javascript:void(0)" onclick="window.opener.shareCard()">📤 share</a>
        </body>
        </html>
    `);

    newWindow.document.close();


    // 🔴 Ждём пока QR реально создастся
    setTimeout(() => {

        const svg = hiddenDiv.querySelector("svg");

        if (svg) {
            const clone = svg.cloneNode(true);
            newWindow.document.getElementById("qrcode").appendChild(clone);
        } else {
            newWindow.document.body.innerHTML = "QR не создан";
        }

    }, 400); // задержка 400мс
}
async function shareCard() {

const svg = document.querySelector("#q svg");

if (!svg) {
    alert("QR-код не найден");
    return;
}

const svgData = new XMLSerializer()
    .serializeToString(svg);

const svgBlob = new Blob(
    [svgData],
    { type: "image/svg+xml;charset=utf-8" }
);

const image = new Image();

image.onload = async function() {

    const canvas = document.createElement("canvas");

    canvas.width = image.width;
    canvas.height = image.height;

    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.drawImage(image, 0, 0);

    canvas.toBlob(async function(blob) {

        const file = new File(
            [blob],
            "table-QR.png",
            { type: "image/png" }
        );

        try {

            await navigator.share({
                files: [file],
                title: "Table QR Code"
            });

        } catch(error) {
            console.log(error);
        }

    }, "image/png");

};

image.src = URL.createObjectURL(svgBlob);
}    
window.shareCard = shareCard;  
// Клонируем готовый SVG и вставляем в новую вкладку
</script>

<script>
let startX = null;

document.addEventListener('pointerdown', function(e){
startX = e.clientX;
});

document.addEventListener('pointerup', function(e){

if(startX===null) return;

let dx = e.clientX-startX;

if(dx < -30){
/* влево */
if(
location.pathname.includes('index.html') ||
location.pathname.endsWith('/developer/') ||
location.pathname.endsWith('/')
){
window.location.href='tables.html';
}
}

if(dx > 30){
/* вправо */
if(location.pathname.includes('tables.html')){
window.location.href='index.html';
}
}

startX=null;

});
</script>
</body>
</html>
