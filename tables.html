<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Table QR Generator</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="32x32" type="image/x-icon">         
<meta name="theme-color" content="#4CAF50">
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js')
    .then(() => console.log('Service Worker registered'));
}
</script>
<script src="https://unpkg.com/qr-code-styling/lib/qr-code-styling.js"></script>
<style>
body {
  margin: 0;
  background: #000;
  color: #00ff99;
  font-family: monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  touch-action: pan-y;
} 

.box {
  background: #111;
  border: 2px solid #00ff99;
  border-radius: 15px;
  padding: 25px;
  max-width: 350px;
  width: 90%;
  box-sizing: border-box;
  text-align: center;
}

input, button {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border-radius: 8px;
  border: 2px solid #00ff99;
  background: #000;
  color: #00ff99;
  margin-top: 15px;
  box-sizing: border-box;
}

button {
  cursor: pointer;
  transition: 0.2s;
}
button:hover {
  background: #00ff99;
  color: #000;
}

#qrcode { 
   display: flex;
   margin: 20px auto;
   justify-content: center;
}
</style>
</head>
<body>
<div class="box">
   <h2>📇 Table QR Generator</h2>

   <p>Enter the URL of your website:</p>
   <input type="text" id="urlInput"
   placeholder="https://example.com/menu">

   <p>Enter the table number:</p>
   <input type="number" id="tableNumber"
   min="1" max="100">

   <button onclick="generateQR()">
      Generate QR
   </button>

   <div id="hiddenQR" style="display:none;"></div>
</div>


<script src="https://unpkg.com/qr-code-styling/lib/qr-code-styling.js"></script>

<script>

function generateQR(){

const url =
document.getElementById("urlInput").value.trim();

const table =
document.getElementById("tableNumber").value.trim();

if(!url){
alert("Введите URL");
return;
}

if(!table || isNaN(table) || table < 1 || table > 100){
alert("Столик 1–100");
return;
}

const qrText =
`${url}?table=${table}`;


const hiddenDiv =
document.getElementById("hiddenQR");

hiddenDiv.innerHTML="";

const size =
Math.min(window.innerWidth*0.9, 400);


const qrCode =
new QRCodeStyling({

width:size,
height:size,
type:"svg",
data:qrText,

image:"icon-192.png",

dotsOptions:{
type:"dots",
color:"#000"
},

cornersSquareOptions:{
type:"extra-rounded",
color:"#000"
},

cornersDotOptions:{
type:"dot",
color:"#000"
},

backgroundOptions:{
color:"#fff"
},

imageOptions:{
margin:10,
imageSize:0.22
},

qrOptions:{
errorCorrectionLevel:"Q"
}

});

qrCode.append(hiddenDiv);


const win =
window.open("","_blank");

win.document.write(`
<html>
<head>
<style>
body{
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:white;
}
</style>
</head>
<body>
<div id="q"></div>
</body>
</html>
`);

win.document.close();


setTimeout(()=>{

const svg =
hiddenDiv.querySelector("svg");

if(svg){

win.document
.getElementById("q")
.appendChild(svg.cloneNode(true));

}else{

win.document.body.innerHTML =
"QR не создан";

}

},400);

}

</script>
  
<script>

let startX = null;

document.addEventListener('pointerdown', function(e){
startX = e.clientX;
});

document.addEventListener('pointerup', function(e){

if(startX===null) return;

let dx = e.clientX-startX;

if(dx < -30){
/* влево */
if(
location.pathname.includes('index.html') ||
location.pathname.endsWith('/developer/') ||
location.pathname.endsWith('/')
){
window.location.href='tables.html';
}
}

if(dx > 30){
/* вправо */
if(location.pathname.includes('tables.html')){
window.location.href='index.html';
}
}

startX=null;

});
</script>
</body>
</html>
